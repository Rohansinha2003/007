[project]
name = "resumeforge"
version = "0.1.0"
description = "Evidence-based resume builder: every claim links to evidence from your real work history."
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.70",
    "typer>=0.12",
    "pydantic>=2.6",
    "pyyaml>=6.0.4",
    "python-docx>=1.2.0",
    "fpdf2>=2.9.0",
]

[project.scripts]
resume = "resumeforge.cli:app"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/resumeforge"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
